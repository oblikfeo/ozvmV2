# Розничная часть ЗооВетМир — статический сайт на поддомене.
# Файлы монтируются с хоста: /var/www/shop.ozvm.ru

server {
    listen 80;
    server_name shop.ozvm.ru;

    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/acme-challenge/.well-known/acme-challenge/;
        try_files $uri =404;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name shop.ozvm.ru;

    ssl_certificate /etc/letsencrypt/live/shop.ozvm.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.ozvm.ru/privkey.pem;

    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/acme-challenge/.well-known/acme-challenge/;
        try_files $uri =404;
    }

    root /var/www/shop.ozvm.ru;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/shop.ozvm.ru.access.log;
    error_log  /var/log/nginx/shop.ozvm.ru.error.log;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # Корень поддомена отдаёт лендинг. Файлы лежат там же, где в репозитории.
    location = / {
        try_files /landing/index.html =404;
    }

    location = /landing/ {
        return 301 /;
    }

    location = /landing/index.html {
        return 301 /;
    }

    # Свой вход в админке демонстрационный: пароль лежит в js/auth.js
    # открытым текстом. Настоящая защита — только basic auth здесь.
    location = /admin.html {
        auth_basic "ZooVetMir admin";
        auth_basic_user_file /etc/nginx/conf.d/.htpasswd-shop;
        try_files $uri =404;
    }

    # Служебное наружу не отдаём
    location ~ /\.(git|htpasswd) {
        deny all;
    }

    location ^~ /deploy/ {
        deny all;
    }

    # У файлов нет хешей в именах, поэтому css и js кешируем ненадолго.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location ~* \.(jpg|jpeg|png|webp|svg|ico|woff2)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
