# Розничная часть ЗооВетМир — статический сайт на поддомене.
# Файлы монтируются с хоста: /var/www/shop.ozvm.ru

server {
    listen 80;
    server_name shop.ozvm.ru;

    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/acme-challenge/.well-known/acme-challenge/;
        try_files $uri =404;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name shop.ozvm.ru;

    ssl_certificate /etc/letsencrypt/live/shop.ozvm.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.ozvm.ru/privkey.pem;

    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/acme-challenge/.well-known/acme-challenge/;
        try_files $uri =404;
    }

    root /var/www/shop.ozvm.ru;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/shop.ozvm.ru.access.log;
    error_log  /var/log/nginx/shop.ozvm.ru.error.log;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # Корень поддомена отдаёт лендинг. Файлы лежат там же, где в репозитории.
    location = / {
        try_files /landing/index.html =404;
    }

    location = /landing/ {
        return 301 /;
    }

    location = /landing/index.html {
        return 301 /;
    }

    # --- Акции ---------------------------------------------------------
    # Витрина живёт по /stock, карточка — по /stock/<id>. Файлы при этом
    # остаются index.html и promotion.html в корне репозитория.
    location = /stock {
        try_files /index.html =404;
    }

    location ~ "^/stock/[^/]+$" {
        try_files /promotion.html =404;
    }

    # Старые адреса сводим к новым, id не теряем
    location = /index.html {
        return 301 /stock;
    }

    location = /promotion.html {
        if ($arg_id) {
            return 301 /stock/$arg_id;
        }
        return 301 /stock;
    }

    # Служебное наружу не отдаём
    location ~ /\.(git|htpasswd) {
        deny all;
    }

    location ^~ /deploy/ {
        deny all;
    }

    # Документация репозитория наружу не нужна: DEPLOY.md описывает
    # устройство сервера и пути на нём.
    location ~* \.(md|yml|yaml)$ {
        deny all;
    }

    # У файлов нет хешей в именах, поэтому html, css и js каждый раз
    # переспрашиваются у сервера. Они маленькие, а по ETag ответ почти всегда
    # 304 без тела. Час кеша тут уже приводил к тому, что после выкладки
    # у людей оставалась старая версия скриптов.
    location ~* \.(html|css|js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(jpg|jpeg|png|webp|svg|ico|woff2)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
