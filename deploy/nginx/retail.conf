# Розничная часть ЗооВетМир — статический сайт на поддомене.
#
# Поставить в /etc/nginx/sites-available/ozvm-retail.conf и слинковать
# в sites-enabled. Перед первым запуском заменить shop.ozvm.ru на выбранный
# поддомен и проверить путь в root.
#
# Сертификат выпускается certbot'ом, он же допишет сюда блок listen 443.
# До выпуска сертификата рабочим остаётся только блок на 80 порту.

server {
    listen 80;
    listen [::]:80;
    server_name shop.ozvm.ru;

    # Путь, куда выкладывается репозиторий
    root /var/www/ozvm-retail;
    index index.html;

    access_log /var/log/nginx/ozvm-retail.access.log;
    error_log  /var/log/nginx/ozvm-retail.error.log;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    charset utf-8;

    # --- Главная -------------------------------------------------------
    # Корень поддомена отдаёт лендинг. Файлы при этом лежат там же, где
    # в репозитории, — ничего не переносим. Чтобы вернуть на корень витрину
    # акций, достаточно удалить этот блок.
    location = / {
        try_files /landing/index.html =404;
    }

    # Лендинг доступен и по своему адресу — сводим к одной странице,
    # чтобы не было двух одинаковых URL.
    location = /landing/ {
        return 301 /;
    }

    location = /landing/index.html {
        return 301 /;
    }

    # --- Админка -------------------------------------------------------
    # Свой вход в админке — демонстрационный: проверка идёт в браузере,
    # пароль лежит в js/auth.js открытым текстом. До настоящей авторизации
    # через Laravel единственная реальная защита — basic auth здесь.
    #
    #   htpasswd -c /etc/nginx/.htpasswd-ozvm-retail admin
    #
    location = /admin.html {
        auth_basic "ЗооВетМир — админка";
        auth_basic_user_file /etc/nginx/.htpasswd-ozvm-retail;
        try_files $uri =404;
    }

    # --- Кеширование ---------------------------------------------------
    # У файлов нет хешей в именах, поэтому css и js кешируем ненадолго,
    # иначе после выкладки у клиента останется старая версия.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location ~* \.(jpg|jpeg|png|webp|svg|ico|woff2)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
