# Запуск розничной части контейнером. Порт отдаём наружу на 8081,
# а публичный 80/443 и сертификат остаются на nginx хоста, который
# проксирует поддомен сюда (см. DEPLOY.md, вариант Б).

services:
  retail:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ozvm-retail
    container_name: ozvm-retail
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
